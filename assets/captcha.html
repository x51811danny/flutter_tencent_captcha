<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <style>
      * {
        -webkit-user-select: none;
      }
      html,
      body {
        background-color: transparent;
        margin: 0;
        padding: 0;
      }
    </style>
    <script src="https://turing.captcha.qcloud.com/TCaptcha.js"></script>
  </head>
  <body>
    <script type="text/javascript">
      const bridgeMethod = (method, data) => {
        if (window.webkit) {
          window.webkit.messageHandlers[method].postMessage(data);
        } else if (window.messageHandlers) {
          window.messageHandlers[method](JSON.stringify(data));
        } else {
          console.log(method, data);
        }
      };

      const bridgeOnLoaded = (data) => bridgeMethod("onLoaded", data);
      const bridgeOnSuccess = (data) => bridgeMethod("onSuccess", data);
      const bridgeOnFail = (data) => bridgeMethod("onFail", data);

      const verify = (configJsonString) => {
        let config = JSON.parse(configJsonString);
        config = Object.assign(config, {
          ready: (data) => {
            bridgeOnLoaded(data);
          },
        });
        let appId = config.appId;
        delete config.appId;
        try {
          const txCaptcha = new TencentCaptcha(
            appId,
            (res) => {
              if (res.ret === 0) {
                bridgeOnSuccess(res);
              } else {
                bridgeOnFail(res);
              }
            },
            config,
          );
          txCaptcha.show();
        } catch (error) {
          // TCaptcha.js 載入失敗：依騰訊雲官方容災做法產生 terror ticket，交由後端判斷是否放行
          bridgeOnSuccess({
            ret: 0,
            ticket: "terror_1001_" + appId + "_" + Math.floor(Date.now() / 1000),
            randstr: "@" + Math.random().toString(36).slice(2),
            errorCode: 1001,
            errorMessage: "jsload_error",
          });
        }
      };

      window._verify = verify;
    </script>
  </body>
</html>
