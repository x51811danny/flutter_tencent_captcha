<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <style>
      * {
        -webkit-user-select: none;
      }
      html,
      body {
        background-color: transparent;
        margin: 0;
        padding: 0;
        height: 100%;
      }
      /* 國際版 SDK 只支援掛進容器，遮罩與面板由本頁自繪 */
      .backdrop {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgba(0, 0, 0, 0.5);
        /* SDK 就緒前整頁透明（由宿主 App 顯示自己的 loading），就緒後淡入，避免先閃一個空白面板 */
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease-out, visibility 0s linear 0.3s;
      }
      .backdrop.revealed {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.3s ease-out, visibility 0s;
      }
      .panel {
        position: relative;
        min-width: 300px;
        max-width: calc(100vw - 32px);
        padding: 36px 12px 12px;
        border-radius: 12px;
        background-color: #fff;
        box-sizing: border-box;
      }
      .close {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 32px;
        height: 32px;
        border: 0;
        background: transparent;
        font-size: 22px;
        line-height: 32px;
        color: #999;
      }
    </style>
    <!-- 後端對接的是騰訊雲國際版，須用國際版 SDK；大陸版 TCaptcha.js 會回 1006 -->
    <script src="https://ca.turing.captcha.qcloud.com/TJNCaptcha-global.js"></script>
  </head>
  <body>
    <div class="backdrop">
      <div class="panel">
        <button class="close" type="button" aria-label="close" id="close">×</button>
        <div id="captcha-container"></div>
      </div>
    </div>
    <script type="text/javascript">
      const bridgeMethod = (method, data) => {
        if (window.webkit) {
          window.webkit.messageHandlers[method].postMessage(data);
        } else if (window.messageHandlers) {
          window.messageHandlers[method](JSON.stringify(data));
        } else {
          console.log(method, data);
        }
      };

      const bridgeOnLoaded = (data) => bridgeMethod("onLoaded", data);
      const bridgeOnSuccess = (data) => bridgeMethod("onSuccess", data);
      const bridgeOnFail = (data) => bridgeMethod("onFail", data);

      // SDK 把驗證碼畫進容器後才顯示面板並通知宿主收起 loading（onLoaded）。
      // 國際版容器寫法實測不會呼叫 ready，改以容器出現子節點為準；ready 仍保留，誰先到算誰。
      // 遲遲畫不出來時逾時照樣顯示，至少能按關閉。
      const REVEAL_TIMEOUT_MS = 8000;
      let revealed = false;
      const reveal = (data) => {
        if (revealed) return;
        revealed = true;
        document.querySelector(".backdrop").classList.add("revealed");
        bridgeOnLoaded(data || {});
      };

      let finished = false;
      const finish = (callback, data) => {
        if (finished) return;
        finished = true;
        callback(data);
      };

      // 與 JS SDK 使用者關閉（ret=2）同形
      document.getElementById("close").addEventListener("click", () => {
        finish(bridgeOnFail, { ret: 2 });
      });

      const verify = (configJsonString) => {
        let config = JSON.parse(configJsonString);
        config = Object.assign(config, {
          ready: (data) => {
            reveal(data);
          },
        });
        let appId = config.appId;
        delete config.appId;
        // baseUrl 只給原生端決定頁面來源，不傳給 TencentCaptcha
        delete config.baseUrl;
        const container = document.getElementById("captcha-container");
        const observer = new MutationObserver(() => {
          if (container.childElementCount > 0) {
            observer.disconnect();
            reveal({});
          }
        });
        observer.observe(container, { childList: true });
        try {
          const txCaptcha = new TencentCaptcha(
            container,
            appId,
            (res) => {
              if (res.ret === 0) {
                finish(bridgeOnSuccess, res);
              } else {
                finish(bridgeOnFail, res);
              }
            },
            config,
          );
          txCaptcha.show();
          setTimeout(() => reveal({ timeout: true }), REVEAL_TIMEOUT_MS);
        } catch (error) {
          // SDK 載入失敗：依騰訊雲官方容災做法產生 trerror ticket，交由後端判斷是否放行
          finish(bridgeOnSuccess, {
            ret: 0,
            ticket: "trerror_1001_" + appId + "_" + Math.floor(Date.now() / 1000),
            randstr: "@" + Math.random().toString(36).slice(2),
            errorCode: 1001,
            errorMessage: "jsload_error",
          });
        }
      };

      window._verify = verify;
    </script>
  </body>
</html>
